[project]
name = "url-to-print-design"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.12.5",
  "pydantic-settings>=2.12.0",
  "trafilatura>=2.0.0",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Same as 'select = ["E", "F"]'.
# E: pycodestyle
# F: Pyflakes
# I: isort
# S: flake8-bandit
# B: flake8-bugbear
# A: flake8-builtins
# C4: flake8-comprehensions
# SIM: flake8-simplify
# PIE: flake8-pie
# T20: flake8-print
# TID: flake8-tidy-imports
# RSE: flake8-raise
# D: pydocstyle
# N: pep8-naming
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "I",   # isort
  "S",   # flake8-bandit
  "B",   # flake8-bugbear
  "A",   # flake8-builtins
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "RSE", # flake8-raise
  "D",   # pydocstyle
  "N",   # pep8-naming
  "UP",  # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
